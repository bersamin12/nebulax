      input_kind: audio
      implement_hours: 0.0
      reference_id:
      - R75
      skip_reason: No microphone channel exists in the door controller stream.
    augmentation:
    - name: window_warping
      priority: must
      applies_to: raw_cycle_rows_only
      preserves: class label; NOT duration or phase
      fold_only: true
      reference_id:
      - R292
      - R293
      note: highest average rank for VGG/ResNet/LSTM in the 128-dataset survey; gain
        is largest at small training-set size.
    - name: magnitude_warping_jitter
      priority: must
      applies_to: raw_cycle_rows_only
      preserves: class label and temporal order; changes amplitude scale
      fold_only: true
      reference_id:
      - R292
    - name: wdba_barycentre
      priority: nice
      applies_to: abnormal_class_only
      preserves: the DTW-space average shape of the class; assumes warping invariance
      fold_only: true
      reference_id:
      - R297
      - R292
      note: generates low-diversity samples; complement to window warping, not a replacement.
        Pattern-mixing costs 60+ s per generated sample.
    - name: physical_consistency_pass_rate
      priority: nice
      applies_to: injected_cycles
      preserves: kinematic consistency (travel, dwell, velocity/acceleration envelope)
      fold_only: true
      reference_id:
      - R68
      - R306
      note: report the pass rate as a number, the way the door reference pipeline
        reports 98.8 %. This is the differentiating contribution, not any generic
        transform.
    - name: rotation_flip
      priority: skip
      reference_id:
      - R292
      skip_reason: Door motor current has a physical sign; rotation/flipping decreased
        accuracy for all six architectures tested.
    - name: permutation
      priority: skip
      reference_id:
      - R292
      - R295
      skip_reason: Cycle phases are ordered (unlock, open, dwell, close, lock); permuting
        them creates a cycle that could not physically occur. R295 reports permutation
        as a winner — the conflict is named in the addendum and R292 is the larger
        study.
    - name: window_slicing
      priority: skip
      reference_id:
      - R293
      skip_reason: The fault signature lives in one phase of the cycle, so the label
        is not sub-window stationary; slicing is label noise.
  rail:
    task: cls
    signals:
    - speed_pulse_90_tooth
    - car{1..8}_pos{1..8}_vibration
    - car{1..8}_pos{1..8}_shock
    n_channels: 129
    sample_rate_hz: 10000
    record_seconds: 1.0
    unit_of_analysis: file
    labels:
    - Normal
    - Side I
    - Side II
    class_counts:
      Normal: 234
      Side I: 14
      Side II: 24
    geometry:
      wheel_diameter_m: 0.85
      wheel_circumference_m: 2.67
      tacho_teeth: 90
      travel_per_pulse_mm: 29.67
      spatial_sample_at_67kmh_mm: 1.86
      target_wavelength_mm:
      - 25
      - 80
      passing_frequency_hz_over_0_to_67kmh:
      - 35
      - 744
      reference_id:
      - R248
      - R237
    datasets:
    - ps3_rail
    primary_metric: macro_f1
    splits:
    - ps3_rail_sgkf5
    - contiguous_filename_blocks
    - leave_speed_range_out
    validation:
      scheme: stratified 5-fold by file x 3 seeds, plus two stress splits
      report:
      - all_files_macro_f1
      - speed_matched_macro_f1_v_ge_35
      - per_class_f1
      - no_speed_feature_ablation
      - duplicate_fingerprint_check
      expected_band:
      - 0.7
      - 0.85
      expected_band_reference_id:
      - R241
      pitfalls:
      - 'SPEED CONFOUND: Normal spans 0-65 km/h and faults 35-67, so a speed-only
        classifier scores well and means nothing. Speed-matched macro F1 and a no-speed-feature
        ablation are mandatory, not optional.'
      - 14 Side I examples means ~2.8 per fold and macro F1 is dominated by that class
        — report mean +/- sd over 3 seeds, never a point estimate.
      - Never normalise per file with statistics pooled across folds.
      - Mirror-augmented children must stay in their parent file's fold.
      - The v < 20 km/h -> Normal rule is a documented dataset shortcut, not a model.
      pitfall_reference_id:
      - R58
      - R115
      - R303
    models:
    - name: tacho_distance_resampling
      family: order_tracking
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: numpy
      input_kind: raw_10khz
      implement_hours: 3.0
      reference_id:
      - R245
      - R239
      note: cumulative pulse count IS a distance encoder — integrate it, never differentiate
        it. Linear interpolation of pulse edges to constant dx ~ 1 mm; computed order
        tracking with a real keyphasor, ~60 lines of numpy, no library.
    - name: wavelength_third_octave_psd
      family: spectral
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: scipy.signal.welch + band integration
      input_kind: distance_resampled
      implement_hours: 1.5
      reference_id:
      - R233
      - R250
      - R239
      note: 1/3-octave WAVELENGTH bands over ~8-500 mm. Fixed-Hz bands cannot work
        — the passing frequency sweeps 35-744 Hz over the speed range.
