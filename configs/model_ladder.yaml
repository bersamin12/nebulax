evaluation:
  primary_metric: vus_pr
  metric_implementations:
    vus_pr:
      source: vendored_from_tsb_ad
      reference_id:
      - R7
      - R1
    affiliation_f:
      source: tsb_ad
      reference_id:
      - R8
      role: secondary
      caveat: gameable at N~3 under best-of-N (R10)
    range_based_f:
      source: tsb_ad
      reference_id:
      - R9
      role: secondary
      caveat: fix position/cardinality weights once and state them
    pa_k:
      source: tadpak
      reference_id:
      - R2
      - R10
      role: secondary_axis
    event_metrics:
      source: handwritten
      reference_id:
      - R90
      - R93
      - R101
      role: primary_operational
    taxonomy_check:
      source: tsadmetrics
      reference_id:
      - R102
      licence: GPL-3.0
      note: harness only; state the taxonomy class of every reported metric and that
        TPDM / point-adjusted variants are excluded
  excluded:
  - name: point_adjusted_f1
    reference_id:
    - R2
    - R1
    reason: A random anomaly score attains SOTA PA-F1; TSB-AD removes point adjustment
      entirely.
  - name: vus_roc
    reference_id:
    - R10
    reason: ROC-based metrics become gameable at N~9-11 under best-of-N; PR-based
      stay near-flat.
  - name: best_of_n
    reference_id:
    - R10
    reason: Single honest runs with fixed, stated seeds only.
  episode_definition:
    min_consecutive_windows: 3
    merge_gap_hours: 1
  threshold_calibration:
    fit_on: validation_only
    false_alarm_budget: <=1 episode per 7 train-days
    also_report_quantiles:
    - 0.995
    - 0.999
    adaptive:
      method: weighted_quantile_conformal
      reference_id:
      - R42
  cpd_score_adapter:
    why: VUS-PR requires a CONTINUOUS per-timestamp score (R7), but ruptures/claspy/changeforest/aeon
      segmenters emit DISCRETE breakpoints and river drift detectors emit BOOLEANS.
      Written once, reused by every task:cpd row.
    implement_hours: 2.0
    mapping:
      offline_cpd: exponential kernel on distance to the nearest breakpoint, or the
        cost-improvement curve
      segmentation_clasp: the ClaSP profile itself (already a per-timestamp curve)
      drift_page_hinkley: the running cumulative statistic
      drift_adwin: the `estimation` drift magnitude
      bayesian_online_cpd: run-length posterior — natively continuous, no adapter
        needed
  cpd_metrics:
    covering_metric:
      source: port from TCPDBench (MIT)
      reference_id:
      - R175
      formula: C(G,G') = (1/T) * sum_{A in G} |A| * max_{A' in G'} J(A,A')
      role: primary_segmentation
      implement_hours: 1.0
    f1_at_annotation_margin:
      source: port from TCPDBench (MIT)
      reference_id:
      - R175
      params:
        margin_timesteps: 5
      role: primary_segmentation
      implement_hours: 1.0
      caveat: integrate over the margin rather than fixing one value, by the same
        argument VUS makes for its tolerance buffer (R7)
    affiliation_f:
      source: tsb_ad
      reference_id:
      - R8
      role: cross_family_bridge
      note: defined by TEMPORAL DISTANCE between predicted and true event sets, so
        it scores discrete CPD output and discrete AD output on identical footing
        with NO adapter; also normalises against a random baseline
    excluded:
    - name: f1_at_margin_reported_alone
      reference_id:
      - R184
      reason: 'Localisation accuracy is not the same objective as downstream utility;
        report covering and affiliation alongside it. Caveat: R184 used artificial
        fully-labelled streams, so this is a methodological warning, not rail evidence.'
    evidence_limit: 'No change-point benchmark on rail or industrial compressor telemetry
      was found. TCPD is 37 general real-world series (R175), the ClaSP benchmark
      is 107 segmentation datasets (R177), and changeforest''s evidence is a SIMULATION
      study (R187). The one rail-adjacent signal is indirect: TimesFM failed at multivariate
      AD on SWaT but the authors concluded it is "promising for change-point detection"
      (R36). Say that plainly; do not imply a rail benchmark exists.'
  rul_metrics:
    alpha_lambda:
      source: progpy
      reference_id:
      - R215
      - R216
      - R201
      role: primary
      requires: predictive_distribution
    prognostic_horizon:
      source: progpy
      reference_id:
      - R215
      - R201
      role: primary
    cumulative_relative_accuracy:
      source: progpy
      reference_id:
      - R215
      - R201
      role: primary
    monotonicity:
      source: progpy
      reference_id:
      - R215
      - R201
      - R218
      role: primary
    rmse:
      source: sklearn
      role: primary
    cmapss_asymmetric_score:
      source: handwritten
      reference_id:
      - R217
      role: secondary
      implement_hours: 0.25
      caveat: UNNORMALISED and exponential — one badly-late unit dominates the fleet
        total and it is NOT comparable across datasets with different unit counts
        or life lengths. Report BESIDE rmse and a per-unit error distribution, NEVER
        alone. This is the RUL-side analogue of the no-point-adjustment rule.
    metric_definitions_status: NUMBERS UNVERIFIED — the R215 landing-page abstract
      does not enumerate the metric names; our mapping rests on ProgPy implementing
      exactly these four. Read the PDF before quoting definitions verbatim.
  rul_splits:
    rule: leave_one_unit_out
    reference_id:
    - R219
    - R220
    detail: Leave-one-bearing-out on XJTU-SY and FEMTO; never random window splits.
      Fit scalers and health- index normalisation on TRAINING bearings only. Device-level
      leakage optimistically biases RUL benchmarks (R219), and naive splitting inflates
      accuracy from a genuine 20-60% to 99.9% on the same data (R220). Both sources
      are NOT PEER-REVIEWED preprints — cite them for the protocol, not for a number.
    seeds: 5
    population_baseline:
      model: weibull_population_baseline
      reference_id:
      - R204
      role: the 'knowing nothing about this unit' control — RUL analogue of the random-score
        row
  reporting:
    critical_difference_diagram:
      source: aeon
      reference_id:
      - R63
      - R43
    cost_table:
      reference_id:
      - R37
      - R189
      columns:
      - latency_ms
      - peak_vram_mb
      - state_dict_mb
      - fit_seconds
      note: TimeEval (R189) is the one peer-reviewed source systematically reporting
        runtime alongside accuracy across 71 detectors and 976 datasets; NUMBERS UNVERIFIED,
        do not quote its per-algorithm winners
ps3:
  meta:
    added: 2026-09-17
    source_doc: docs/research/ps3_addendum.md
    references: docs/research/references.md section L (R231-R314)
    note: Problem Statement 3 released four supervised tasks with their own metrics;
      these four blocks are the machine-readable mirror of the addendum's ladder tables.
      implement_hours here are PS3-specific and are NOT booked against the door/pneumatic/bearing
      totals in meta.must_hours_breakdown.
    must_implement_hours:
      door: 10.5
      rail: 12.5
      acv: 9.0
      shm: 13.0
      note: SHM includes the 3.0 h conditional FDS row (MUST only if the rainflow
        diagnostic shows scatter tracking the irregularity factor); 10.0 h without
        it.
    fold_local_rule: Every scaler, threshold, template, band edge, rule weight, sign,
      bias correction, feature selection and augmentation is fitted INSIDE the training
      fold; model selection is nested or on a frozen outer split, never on the CV
      used for the headline; augmented children stay in their source file's fold;
      held-out files are never augmented.
    fold_local_reference_id:
    - R303
    - R220
    - R115
    forbidden:
    - augmenting_before_the_split
    - transductive_normalisation_in_a_headline_row
    - test_data_in_threshold_calibration
    - selecting_on_the_reported_cv
    refuted_citation:
      identifier: 10.1016/j.apenergy.2025.126786
      claim: few-shot adaptive weighted prototype network, mean F1 73.77% on ASHRAE
        RP-1043 severity 1 / 67.22% on RP-1312 AHU summer
      verdict: REFUTED — the DOI resolves to an unrelated fuel-cell paper and the
        numbers could not be located in any paper. NEVER cite it or its numbers. Use
        R268 for a verified limited-labels HVAC-FDD citation.
  door:
    task: seg_cls
    signals:
    - time
    - motor_current_mA
    - motor_voltage_10mV
    - back_emf
    - opening_time_0p1s
    - closing_time_0p1s
    - close_command
    - open_command
    - DCSR
    - DCSL
    - DLSR
    - DLSL
    - door_opened
    - door_locked
    - opening
    - closing
    - door_position
    n_channels: 17
    sample_rate_hz: 50
    unit_of_analysis: door_cycle
    labels:
    - Normal
    - Abnormal resistance
    datasets:
    - ps3_door
    primary_metric: iou_weighted_f1
    splits:
    - ps3_door_blocks
    validation:
      scheme: 5 contiguous time blocks of the raw Train stream; segmentation AND classification
        re-run end to end on each held block
      diagnostics:
      - oracle_segment_f1
      pitfalls:
      - Tune the decision threshold on fold IoU-F1 of the FULL pipeline, never on
        cycle-level F1 — over-segmentation is free under one and charged under the
        other.
      - Matching is one-to-one and greedy by IoU, so never emit overlapping candidate
        segments.
      - A wrong label costs a miss AND a false positive; it is not a partial credit
        case.
      - The within-block batch-normalisation variant is TRANSDUCTIVE (it reads the
        held-out block's own statistics) — ablation row only, labelled as such.
      pitfall_reference_id:
      - R303
    models:
    - name: gap_segmenter
      family: segmentation
      tier: statistical
      priority: must
      task: seg
      source: handwritten
      impl: numpy
      input_kind: raw_stream
      implement_hours: 0.5
      note: new cycle where dt > 0.5 s; ms-exact; never trim. 109/110 Train cycle
        starts coincide with a gap, but the metric charges for boundaries so the rule
        must be exact.
    - name: command_position_state_machine
      family: segmentation
      tier: statistical
      priority: must
      task: seg
      source: handwritten
      impl: numpy
      input_kind: raw_stream
      implement_hours: 2.0
      note: fallback segmenter with hysteresis; gaps are a dataset artefact, not a
        controller guarantee. Test it on Train with the gaps removed.
    - name: ps3_door_clasp_cycle_segmentation
      family: segmentation
      tier: statistical
      priority: nice
      task: seg
      source: claspy
      impl: BinaryClaSPSegmentation
      input_kind: cycle_window
      implement_hours: 2.0
      reference_id:
      - R176
      - R177
      - R64
      note: hyper-parameter-free, so nothing to calibrate under the fold-local rule;
        the learned alternative to the fixed three-regime split.
    - name: fold_local_operation_baseline
      family: peer_normalisation
      tier: statistical
      priority: must
      task: features
      source: nebulax
      impl: features.peer_normalise
      input_kind: cycle_features
      implement_hours: 1.0
      reference_id:
      - R78
      note: per-operation (Open/Close) baseline fitted on the training fold plus a
        robust peer z; cancels per-door distribution shift without a labelled normal
        period. Info kit core problem 2.
    - name: physics_cycle_features
      family: feature_set
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: numpy+pywt
      input_kind: cycle_window
      implement_hours: 0.0
      reference_id:
      - R64
      - R66
      - R67
      note: per-regime current stats on the accelerate/cruise/decelerate split, i_mid
        over 15-85% travel, back-EMF residual V - i*R - k*omega, energy proxy sum(i*dpos),
        peak position, current-vs-position template distance (template fitted in-fold),
        duration vs the commanded open/close registers, DWT detail-band L1 norms at
        the two coarsest levels, starting-current peak.
    - name: logreg_cycle
      family: linear
      tier: statistical
      priority: must
      task: cls
      source: sklearn
      impl: LogisticRegression
      input_kind: cycle_features
      implement_hours: 1.0
