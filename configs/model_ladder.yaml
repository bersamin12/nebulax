      PrognosticsModel gives particle-filter RUL with uncertainty bands PLUS alpha_lambda
      / prognostic_horizon / cumulative_relative_accuracy / monotonicity for free.
      Strong twin demo: a widening RUL band, not a point estimate. MIT fallback: filterpy
      (Kalman only, no particle filter) or ~60 lines of bootstrap resampling.'
  - name: lgbm_rul_regression
    family: gradient_boosting
    tier: boosting
    priority: nice
    source: lightgbm
    impl: lightgbm
    input_kind: window_stats
    implement_hours: 2.0
    reference_id:
    - R222
    task: rul
    note: 'evidence, not habit: on C-MAPSS FD003 XGBoost RMSE 13.36 beats a 1D CNN
      (15.68) and an LSTM (14.20). The cheap supervised RUL row the deep arm must
      clear.'
  - name: weibull_population_baseline
    family: survival
    tier: statistical
    priority: nice
    source: sklearn
    impl: surpyval
    input_kind: window_stats
    implement_hours: 0.0
    reference_id:
    - R204
    - R203
    task: rul
    licence: MIT
  - name: tabular_fm_incontext_rul
    family: tsfm_embedding
    tier: foundation
    priority: nice
    source: hf
    impl: tabpfn
    input_kind: window_stats
    implement_hours: 3.0
    reference_id:
    - R223
    task: rul
    note: 'needs NO training run on the A4500 and reports the best average ranks across
      prognostic and diagnostic PHM tasks specifically in LOW-DATA regimes, which
      is our regime. UNVERIFIED: the benchmark datasets are not named on the abstract
      page, so whether bearing run-to-failure sets are among them is unknown. NICE,
      never MUST.'
  - name: deep_sequence_rul
    family: deep_regression
    tier: deep
    priority: skip
    source: torch-handwritten
    impl: torch
    input_kind: raw_window
    implement_hours: 6.0
    reference_id:
    - R221
    - R222
    task: rul
    skip_reason: 'V7: the generalization bound O(B^2*sqrt(p/n)) in the NUMBER OF RUN-TO-FAILURE
      TRAJECTORIES puts n ~ 15 (XJTU-SY) far outside a deep net''s sample-efficient
      regime, while embedding degradation physics can cut data requirements by up
      to two orders of magnitude (R221); and a boosted tree already beats both a CNN
      and an LSTM on C-MAPSS FD003 (R222), which has MORE data than we do. The drsn_lstm_health_index
      NICE row is the one deep exception, kept for its learned denoising on railway
      axle-box signals.'
