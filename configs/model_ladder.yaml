      - R235
      note: per-side median and 90th percentile over the 32 odd (Side I) and 32 even
        (Side II) channels, plus the Side I - Side II contrast in dB. The label IS
        a side, and the contrast removes speed, track type and sensor gain as common
        mode.
    - name: impulsive_vs_sustained_discriminators
