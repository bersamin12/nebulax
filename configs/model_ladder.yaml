    augmentation:
    - name: c_mixup
      priority: must
      applies_to: whole_files_in_log_feature_space
      preserves: the label under local linearity — pairs are sampled by label similarity,
        so the interpolated damage is meaningful
      fold_only: true
      implement_hours: 2.5
      reference_id:
      - R299
      note: vanilla mixup on regression labels can produce arbitrarily incorrect labels;
        C-Mixup is the published fix. One ablation row; report whether it changed
        LOO MAPE.
    - name: anchor_data_augmentation
      priority: nice
      applies_to: whole_files_in_log_feature_space
      preserves: the causal/invariant part of the regression function; assumes a meaningful
        clustering of the 64 files exists
      fold_only: true
      implement_hours: 3.0
      reference_id:
      - R300
      note: run ONLY if C-Mixup's kernel bandwidth proves fiddly — they solve the
        same problem and doing both wastes the budget.
    - name: cropping_slicing
      priority: skip
      reference_id:
      - R293
      skip_reason: Damage is cumulative over the whole record, so no sub-window carries
        the label. Cropping is label noise, not augmentation.
    - name: vanilla_mixup
      priority: skip
      reference_id:
      - R299
      skip_reason: Mixing regression labels linearly without label-similarity weighting
        can produce arbitrarily incorrect labels.
    - name: tvar_generative_synthesis
      priority: skip
      reference_id:
      - R313
      skip_reason: NOT PEER-REVIEWED, and its reported effect sizes rest on n=5 experiments.
    - name: gan_diffusion_synthesis
      priority: skip
      reference_id:
      - R307
      - R308
      - R304
      skip_reason: 64 files is far too few to fit a generator that is not memorising,
        and generated-series quality is contested across measures.
