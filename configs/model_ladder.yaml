      tier: boosting
      priority: must
      task: cls
      source: lightgbm
      impl: nebulax.models.boosting.LGBMThreeRegime
      input_kind: cycle_features
      implement_hours: 2.0
      reference_id:
      - R64
      note: the published traditional door pipeline; the only arm that yields a trendable
