    augmentation:
    - name: mirror_side_swap
      priority: must
      applies_to: all_classes
      preserves: EXACT — swapping the odd/even channel index map maps a Side I record
        to a valid Side II record; label swaps with it
      fold_only: true
      note: not from a paper — it follows from the sensor layout. Turns 14/24 into
        38/38 and imposes the left-right equivariance the physics demands. Highest-value
        augmenter in the whole addendum because it is exact rather than approximate.
    - name: subcrop_0p6_to_0p8s
      priority: nice
      applies_to: distance_resampled_signal
      preserves: class label — corrugation is sustained, so the label IS sub-window
        stationary here
      fold_only: true
      reference_id:
      - R293
    - name: specaugment_band_masking
      priority: nice
      applies_to: wavelength_spectra
      preserves: class label if mask widths stay small relative to the corrugation
        band
      fold_only: true
      reference_id:
      - R298
    - name: per_side_sensor_dropout
      priority: nice
      applies_to: channel_axis
      preserves: side identity; doubles as the sensor-redundancy ablation
      fold_only: true
      reference_id:
      - R57
    - name: morse_wavelet_scalogram_variation
      priority: nice
      applies_to: scalogram_route_only
