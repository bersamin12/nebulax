        training stage
      fold_only: true
      reference_id:
      - R305
    - name: smote_on_spectra
      priority: skip
      reference_id:
      - R302
      skip_reason: The mirror swap is exact and free; SMOTE on 14 spectra is strictly
        worse and adds a failure mode. Balancing also gives no gain for strong tuned
        classifiers.
    - name: gan_diffusion_synthesis
      priority: skip
      reference_id:
      - R307
      - R308
      - R304
      skip_reason: With 14 positives a generator has nothing to learn that is not
        memorisation; the field needed a benchmark because generated-series quality
        is contested and rankings unstable across measures.
  acv:
    task: rank
    signals:
    - setting_mode
    - running_mode
    - control_temperature_cooling
    - control_temperature_heating
    - indoor_average_temperature
    - outdoor_average_temperature
    - load_halved
    - information_valid
    n_channels: 8
    n_cars: 8
    sample_period_s: 30
    record_days:
    - 3
    - 4
    unit_of_analysis: car_within_case
    datasets:
    - ps3_acv
    primary_metric: rank_decay
    chance_floor: 0.5625
    chance_floor_note: mean of (8-(r-1))/8 over r=1..8 = 36/64. Correct-first 1.000,
      second 0.875, third 0.750. At or below the floor is a bug, not a result.
    splits:
    - leave_one_case_out
    validation:
      scheme: leave-one-case-out over the 6 labelled cases, ranker + weights + signs
        frozen on the 5 training cases before each held-out case
      status: EXPLORATORY — 6 cases is both the selection set and the reported number
      report:
      - loco_rank_decay_per_case
      - chance_floor
      - faulty_car_index_distribution
      pitfalls:
      - Six cases is the entire CV; anything selected on it is optimistic. Label the
        result exploratory.
      - Never use a car-ID prior. If the faulty-car index is not uniform across cases
        there is a position confound (end cars carry more solar and door load) and
        peer exchangeability is violated — subtract a per-position offset estimated
        across training cases.
      - Peer normalisation at TEST time is legitimate — it reads only the held-out
        file's own 8 cars and no labels. What must be frozen is the feature set, the
        signs and the weights.
      - Case 4 carries 60 params/car with cars 05-08 entirely NaN; do not use extra
        columns that the test file may not have.
      - load_halved is a legitimate capacity reduction that mimics a leak — condition
        on it, never pool it.
      pitfall_reference_id:
      - R256
      - R263
      expected_band:
      - 0.75
      - 0.95
    models:
    - name: validity_and_mode_gate
      family: preprocessing
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: pandas
      input_kind: telemetry_rows
      implement_hours: 1.0
      reference_id:
      - R259
      note: drop information_valid=0 and Stop rows, keep cooling-mode rows, flag load_halved
        separately, and gate steady vs pull-down with a rolling sigma over a 5-10
        min window plus a same-mode-for-the-window condition. Deviation from the source,
        stated deliberately — gate to SEPARATE the two regimes, not to discard the
        transient, because the pull-down slope is itself a capacity feature.
    - name: duty_cycle_features
      family: feature_set
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: pandas
      input_kind: gated_rows
      implement_hours: 1.5
      reference_id:
      - R253
      note: fraction of cooling time in Full Cooling and Half Cooling, mode-transition
        count per hour, mean on-time per cooling episode. Runtime fraction is the
        one ORNL key variable PS3 still exposes and it rises monotonically with undercharge.
    - name: pulldown_features
      family: feature_set
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: pandas
      input_kind: gated_rows
      implement_hours: 1.5
      reference_id:
      - R254
      note: d(T_indoor)/dt over the first N minutes of each Full-Cooling episode,
        time-to-setpoint, T_indoor - T_outdoor lift achieved.
    - name: unmet_degree_minutes
      family: feature_set
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: pandas
      input_kind: gated_rows
      implement_hours: 0.5
      reference_id:
      - R253
      note: the CONFIRMING, late-stage feature — indoor air temperature barely sees
        low-intensity undercharge and unmet hours appear only at 40-50 % charge loss.
        Never the primary ranker.
    - name: robust_peer_z
      family: peer_normalisation
      tier: statistical
      priority: must
      task: rank
      source: nebulax
      impl: features.peer_normalise
      input_kind: car_features
      implement_hours: 1.0
      reference_id:
      - R251
      - R78
      note: median/MAD of the 7 sibling cars within ambient bins. 7 peers, not 9,000
        — use median/MAD, never mean/sigma.
    - name: peer_regression_median_residual
      family: peer_fleet
      tier: classical
      priority: must
      task: rank
      source: sklearn
      impl: Ridge or GaussianProcessRegressor per peer, median of peer predictions
      input_kind: car_features
      implement_hours: 2.0
      reference_id:
      - R251
      note: fit each peer's feature on (T_outdoor, T_control, load_halved), predict
        the target car from each peer's model, take the MEDIAN (robust with up to
        1/3 of training peers faulty), residual = measured - predicted.
    - name: signed_iqr_fault_index
      family: rule
      tier: statistical
      priority: must
      task: rank
      source: handwritten
      impl: I = sum_k sign_k * (R_k / IQR(R_k))^2 * IQR(SND)
      input_kind: peer_residuals
      implement_hours: 1.0
      reference_id:
      - R251
      - R252
      - R263
      note: sign_k is the known thermodynamic direction of that feature under undercharge.
        Write the fault x feature direction matrix down BEFORE modelling and check
        no other plausible cause shares the signature.
    - name: per_position_offset_correction
      family: rule
      tier: statistical
      priority: must
      task: rank
      source: handwritten
      impl: pandas
      input_kind: car_features
      implement_hours: 0.5
      reference_id:
      - R256
      note: tests the peer-exchangeability assumption the whole method rests on.
    - name: modified_mann_kendall_tiebreak
      family: trend_test
      tier: statistical
      priority: nice
      task: rank
      source: handwritten
      impl: autocorrelation-corrected Mann-Kendall
      input_kind: peer_normalised_index
      implement_hours: 1.0
      reference_id:
      - R266
      note: tie-breaker only. 3-4 days is short for a trend test and a pre-existing
        leak shows as a level, not a slope. 30 s telemetry is heavily autocorrelated,
        hence the modified form.
    - name: within_system_over_time
      family: peer_fleet
      tier: statistical
      priority: nice
      task: rank
      source: handwritten
      impl: pandas
      input_kind: car_features
      implement_hours: 1.5
      reference_id:
      - R256
      - R265
    - name: lbnl_fdd_dryrun
      family: validation
      tier: statistical
      priority: nice
      task: features
      source: external_data
      impl: LBNL FDD RTU subset
      input_kind: telemetry_rows
      implement_hours: 2.0
      reference_id:
      - R264
      note: validates the feature-direction matrix before touching 6 precious cases.
        UNVERIFIED whether the RTU subset contains refrigerant undercharge specifically,
        and the licence is unstated.
    - name: virtual_refrigerant_charge_sensor
      family: virtual_sensor
      tier: classical
      priority: skip
      task: rank
      source: handwritten
      impl: subcooling/superheat regression
      input_kind: refrigerant_side_temperatures
      implement_hours: 6.0
      reference_id:
      - R262
      - R257
      skip_reason: PS3 exposes no pressures, no superheat/subcooling, no power and
        no supply-air temperature. The entire virtual-charge-sensor family is inapplicable
        — say so explicitly, because it is the first thing an HVAC reviewer looks
        for.
    - name: rc_greybox_ekf
      family: physics_greybox
      tier: classical
      priority: skip
      task: rank
      source: handwritten
      impl: 3R2C + extended Kalman filter
      input_kind: gated_rows
      implement_hours: 6.0
      reference_id:
      - R254
      - R255
      skip_reason: The parameter identification is highly non-convex with several
        local optima and needs a model-selection stage per vehicle; the 7 peer cars
        do the same job for free.
    - name: few_shot_metric_learning
      family: similarity_learning
      tier: deep
      priority: skip
      task: rank
      source: torch-handwritten
      impl: similarity/prototype network
      input_kind: car_features
      implement_hours: 5.0
      reference_id:
      - R268
      skip_reason: 6 cases x 8 cars = 48 rows with one positive each. Few-shot methods
        presuppose more labelled episodes than exist, and they target fault typing
        rather than localisation of one known fault type; the peer structure is a
        stronger and cheaper inductive bias.
    - name: physics_simulation_hybrid
      family: hybrid
      tier: classical
      priority: skip
      task: rank
      source: handwritten
      impl: physics model generates faulty data, fused with measurements
      input_kind: telemetry_rows
      implement_hours: 8.0
      reference_id:
      - R267
      skip_reason: Right vehicle and subsystem, wrong fault (air filter), and building
        a physics model of the ACV cycle is well beyond 12 h. Cite it for why train-HVAC
        fault data is scarce and will stay scarce.
    augmentation:
    - name: none
      priority: must
      rationale: The label is "car k of this train is the leaking one". No transform
        of an 8-car train preserves that without also fabricating thermodynamics,
        and synthetic cases would be scored by the same 6-fold CV that selects the
        rule.
      reference_id:
      - R303
    - name: peer_order_shuffle_invariance_check
      priority: nice
      applies_to: test_time_only
      preserves: nothing — it is a symmetry check, not training data
      fold_only: true
      note: the ranker must be invariant to car ordering.
  shm:
    task: reg
    signals:
    - dynamic_stress
    n_channels: 1
    samples_per_file: 581120
    sample_rate_hz: null
    sample_rate_note: unstated by the organisers; the resulting free constant in (nu0+
      * T / C) is harmless — fit it.
    unit_of_analysis: file
    label_range:
    - 0.029
    - 0.928
    label_shape: bimodal, median ~0.10
    datasets:
    - ps3_shm
    primary_metric: mape_score
    primary_metric_formula: max(0, 1 - MAPE)
    splits:
    - leave_one_out
    - ps3_shm_rkf
    validation:
      scheme: LOO plus repeated 5x10-fold outer with nested inner selection; winner
        chosen on the nested CV, not on LOO
      report:
      - mape_overall
      - mape_by_mode_lt_0p25
      - mape_by_mode_ge_0p25
      - bootstrap_noise_floor
      pitfalls:
      - 'MAPE ON SMALL DAMAGES IS THE TRAP: an absolute error of 0.03 is 100 % relative
        error on the smallest file and 3 % on the largest, so the low-damage mode
        decides the score. Always report MAPE split by mode.'
      - Fit log(damage), not damage — OLS in log space approximately minimises relative
        error and matches the power-law physics.
      - Bias correction, including the log->linear retransformation correction, is
        a fitted quantity and belongs INSIDE the fold, as do the S-N exponent and
        the scale constant.
      - Clip predictions to positive finite values.
      - Quote the bootstrap noise floor beside the score so "we stopped here" is a
        measured statement.
      pitfall_reference_id:
      - R269
      - R271
      - R289
    models:
    - name: rainflow_variant_diagnostic
      family: diagnostic
      tier: statistical
      priority: must
      task: diagnostic
      source: handwritten
      impl: own 3-point (ASTM E1049) and 4-point rainflow, numpy
      input_kind: raw_stress
      implement_hours: 1.5
      reference_id:
      - R270
      - R290
      - R269
      - R291
      note: residue conventions {discard, half-cycles, full, repeat-history} x exponent
        grid x Miner variants {original, elementary, knee} x mean-stress {none, Goodman,
        SWT}, plotted as log damage vs log label for all 64 files. Parallel-but-offset
        = free constant; different slope = wrong k; scatter tracking the irregularity
        factor = SDOF/FDS transform; scatter tracking kurtosis = non-Gaussian correction.
        The Haibach k* = 2k-1 rule is SECONDARY-SOURCE (R291) and must not reach a
        deliverable unverified.
    - name: rainflow_sn_fold_calibrated
      family: physics
      tier: statistical
      priority: must
      task: reg
      source: handwritten
      impl: numpy
      input_kind: raw_stress
      implement_hours: 1.5
      reference_id:
      - R269
      - R290
      note: scale and exponent fitted on the training fold. The honest physics row
        the ML must beat.
    - name: dirlik_and_tovo_benasciutti
      family: spectral
      tier: statistical
      priority: must
      task: reg
      source: handwritten
      impl: numpy — implement the closed forms; NO installs (FLife/fatpack unavailable)
      input_kind: psd
      implement_hours: 2.0
      reference_id:
      - R269
      - R275
      - R276
      note: best spectral methods sit within ~7 % relative life error for steel (k
        = 3.324) in the reference review.
    - name: log_space_feature_set
      family: feature_set
      tier: statistical
      priority: must
      task: features
      source: handwritten
      impl: numpy+scipy
      input_kind: raw_stress
      implement_hours: 2.0
      reference_id:
      - R269
      - R277
      note: ~30 features — RMS (sqrt m0), p2p, p99-p01, rainflow-range percentiles,
        kurtosis, skewness, spectral moments m0/m1/m2/m4, nu0+, nup, irregularity
        factor, Vanmarcke bandwidth, spectral damage at 3-4 candidate k, block maxima,
        level crossings.
    - name: ridge_lasso_log
      family: linear
