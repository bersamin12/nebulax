      implement_hours: 1.0
      reference_id:
      - R49
    - name: ps3_door_litetime
      family: deep_cnn
      tier: deep
      priority: nice
      task: cls
      source: aeon
      impl: LITETimeClassifier
      input_kind: raw_cycle_50hz
      implement_hours: 3.0
      reference_id:
      - R53
      budget_minutes: 5
    - name: ps3_door_hive_cote_v2
      family: hybrid
      tier: classical
      priority: skip
      task: cls
      source: aeon
      impl: HIVECOTEV2
      input_kind: raw_cycle_50hz
      implement_hours: 0.0
      reference_id:
      - R52
      - R43
