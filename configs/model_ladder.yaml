meta:
  version: 1
  date: 2026-09-14
  hardware: 1x RTX A4500 20GB, Linux
  team_size: 3
  total_must_implement_hours: 81.5
  must_hours_breakdown:
    pneumatic: 12.0
    bearing: 17.0
    cross_subsystem: 0.0
    evaluation_harness: 6.5
    note: implement_hours is booked ONCE, in the first subsystem that lists a model;
      later subsystems carry 0.0 for the same name. The door subtotal is therefore
      large because most shared models are booked there, not because the door is the
      hardest subsystem.
    trim_note: '14 Sep: user trimmed to core; RUL/survival and most CPD rows demoted
      to nice (see demoted_by on each row).'
  w1_update:
    date: 2026-09-14
    added_families:
    - change_point_detection
    - concept_drift
    - stochastic_degradation_rul
    - survival_analysis
    added_hours: 22.5
    rationale: V4 made change-point scoring the central design decision but no change-point
      model existed in the ladder, and task:rul rows existed for the door only while
      three bearing run-to-failure datasets were being ingested for a capability nothing
      delivered. Both are now closed. See docs/research/model_ladder.md sections 1d,
      2c, 2d, 3c, 3d, 6.6 and 6.7.
  primary_metric: vus_pr
  secondary_metrics:
  - event_recall
  - false_alarms_per_train_day
  - lead_time_distribution
  - affiliation_f
  - range_based_f
  - pa_k
  - auroc
  - auprc
  cpd_metrics:
  - covering_metric
  - f1_at_annotation_margin
  - affiliation_f
  rul_metrics:
  - alpha_lambda
  - prognostic_horizon
  - cumulative_relative_accuracy
  - monotonicity
  - rmse
  - cmapss_asymmetric_score
  forbidden:
  - point_adjustment
  - best_of_n_reporting
  - test_data_in_threshold_calibration
  runs_per_config: 1
  cost_columns:
  - fit_seconds
  - score_seconds_per_10k
  - params
  - peak_ram_mb
  - peak_vram_mb
  - state_dict_mb
  sanity_anchor:
    tsb_ad_m_best_vus_pr: 0.3539
    tsb_ad_u_best_vus_pr: 0.4399
    note: A MetroPT F1 near 1.0 is not a win — a single-feature threshold already
      achieves it (R93).
  research_scope: brake air supply and axle bearing; PS3 tracks remain in ps3 block
operating_environment:
  site: Singapore
  reference_id:
  - R152
  - R153
  - R163
  ambient_temp_c:
    mean_24h:
      min: 26.8
      max: 28.6
    mean_daily_max:
      min: 30.5
      max: 32.4
    mean_daily_min:
      min: 24.3
      max: 25.7
    record:
      min: 19.0
      max: 37.0
    simulator_sweep:
      routine:
      - 24
      - 33
      stress:
      - 19
      - 37
    regulatory_envelope_T1:
    - -25
    - 40
    diurnal_shape_required: true
  relative_humidity_pct:
    annual_mean: 82
    daily_max:
      min: 93.0
      max: 96.5
    daily_min:
      min: 61.4
      max: 68.0
  consequences:
    bearing: 'A healthy box at a 25 K rise sits at 53 C (annual mean ambient), 57
      C (daily max) and 62 C on the record day, against the published Netherlands
      Railways level-4 absolute line of 80 C [R151]. Absolute thresholds are therefore
      far weaker here than in a temperate fleet: the peer-relative feature is the
      primary detector, not a nicety.'
    pneumatic: Dryer ratings are based on SATURATED inlet air, so a tropical inlet
      is the RATED case and the dryer sits at rated load year-round with no seasonal
      relief [R155]. Drive dryer load from inlet TEMPERATURE (moisture carrying capacity),
      not from RH alone.
  unverified:
  - No published LTA/SMRT rolling-stock environmental design specification was found.
  - No measured Singapore MRT TUNNEL temperature or humidity figures were found. Say
    'surface climate normals' on the slide.
pneumatic:
  signals:
